          title: Niccolò Maffezzoli
          subtitle: |
            I am a researcher at Ca' Foscari University of Venice, Italy. 
            My research focuses on machine learning models applied to the cryosphere domain. 
            <br><br> My email is niccolo (dot) maffezzoli (at) unive (dot) it
            <br><br> I received my MSc degree in nuclear and particle physics at Milano-Bicocca University.
            My background is applied particle physics and high-energy physics. My work at the <a href="https://lena.unipv.it/en/the-reactor/" style="color: #C527F5;">Triga Mark II nuclear fission reactor </a> in Pavia (Italy)
            lead my in contact with the ice core science world.
            <br><br> I did my PhD and a PostDoc at the <a href="https://nbi.ku.dk/english/research/pice/centre-for-ice-and-climate/" style="color: #C527F5;">Center for Ice and Climate</a> (Copenhagen, Denmark),  
            working on Continuous Flow Analysis systems and inductively coupled plasma mass 
            spectroscopy for the detection of chemical tracers in order to reconstruct past sea ice conditions.
            <br><br> From 2020 to 2022 I carried out a Marie Curie Fellowship at the University of Venice 
            and University of Bergen with a project on Artificial Intelligence techniques applied to ice core 
            analyses <a href="https://www.icelearning.net" style="color: #C527F5;">(ICELEARNING)</a>. 
            <br><br> From 2022 to 2023 I was PI of the <a href="https://www.climatechange.ai/blog/2022-10-03-grants-icenet" style="color: #C527F5;">ICENET</a>,
            a pilot project on glacier modeling using deep neural networks, at the National Research Council (Institute of Polar Sciences), 
            in collaboration with the University of California, Irvine. From 2023 I was granted another Marie Curie project, SKYNET, 
            to calculate the ice volume of all the World's glaciers, using AI/ML, in collaboration with the University of California 
            Irvine. 
            <br><br> The model is published in the Geophysical Model Development 
            journal <a href="https://gmd.copernicus.org/articles/18/2545/2025/" style="color: #C527F5;">(paper)</a>, 
            the code is publicly available on <a href="https://github.com/nmaffe/iceboost" style="color: #C527F5;">GitHub</a>.
            <br><br> A Web Visualization tool for the global inversion can be found <a href="https://nmaffe.github.io/iceboost_webapp/" style="color: #C527F5;">here</a>.
            <br><br> I am particularly passionate about deep learning and tackling Earth science problems using AI and machine 
            learning methods.

